name: Terraform plan/apply (Seam 3 fixture)

# The provisioning API (terramate-api-wrapper) never runs Terraform itself
# (architecture.md §2) — this repo's own Actions do, exactly as they would for
# a real Terramate repo. Per ADR-0004 the API opens the PR and then waits for
# THIS CI to push the terminal outcome; it no longer polls GitHub for plan or
# merge status. So:
#   - `plan` publishes the plan for the HUMAN reviewer only (not a contract; the
#     API never reads it).
#   - `apply` (on merge) runs `terraform apply` and PUTs `done` (with outputs)
#     or `failed` to the API.
#   - `rejected` (on close-without-merge) PUTs `rejected` to the API.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  checks: write
  pull-requests: read

jobs:
  plan:
    # Convenience for the human reviewer who approves the PR — the API does not
    # read this check run any more (ADR-0004 dropped plan polling).
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -input=false
      - run: terraform plan -input=false -no-color -out=plan.tfplan
      - run: terraform show -no-color plan.tfplan > plan.txt
      - name: Publish plan as a check run (for human reviewers)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const text = fs.readFileSync('plan.txt', 'utf8').slice(0, 65000);
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'terraform-plan',
              head_sha: context.payload.pull_request.head.sha,
              status: 'completed',
              conclusion: 'success',
              output: { title: 'Terraform Plan', summary: 'Plan complete.', text },
            });

  apply:
    # Triggered on PR close (not `push` to main) so this job has the merged
    # PR's own `head.ref` directly — the only place the Step's branch name
    # (`provision/<request_id>/<step_key>`, see server.orchestrator) survives
    # a merge — without having to parse a merge-commit message.
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: hashicorp/setup-terraform@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # report_outputs.py is stdlib-only (urllib/json) — no pip install needed.
      - run: terraform init -input=false
      # tee the apply console so it can be reported as the Step's tf_console;
      # pipefail so a failed apply is detected despite the pipe to tee.
      - id: apply
        continue-on-error: true
        run: |
          set -o pipefail
          terraform apply -input=false -auto-approve -no-color | tee apply.txt
      - name: Report the outcome to the provisioning API (ADR-0004)
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          # `done` if apply succeeded, `failed` if it errored.
          REPORT_STATUS: ${{ steps.apply.outcome == 'success' && 'done' || 'failed' }}
          # The deployed app's base URL and the CI service principal's M2M
          # client-credentials (see fixtures/.../scripts/report_outputs.py and
          # the fixture README). The SP's forwarded identity must be on the
          # app's CI_PRINCIPALS allowlist.
          APP_URL: ${{ secrets.APP_URL }}
          DATABRICKS_HOST: ${{ secrets.CI_DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.CI_DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.CI_DATABRICKS_CLIENT_SECRET }}
        run: |
          export TF_CONSOLE="$(cat apply.txt 2>/dev/null || true)"
          python scripts/report_outputs.py
      - name: Fail the job if apply failed
        if: steps.apply.outcome == 'failure'
        run: exit 1

  rejected:
    # A PR closed WITHOUT merging means a human declined the Step (ADR-0004) —
    # push `rejected` so the API fails the request instead of leaving the Step
    # at `submitted` forever. No Terraform runs; the branch head ref still
    # carries the Step key.
    if: github.event.action == 'closed' && github.event.pull_request.merged == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Report the rejection to the provisioning API (ADR-0004)
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPORT_STATUS: rejected
          APP_URL: ${{ secrets.APP_URL }}
          DATABRICKS_HOST: ${{ secrets.CI_DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.CI_DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.CI_DATABRICKS_CLIENT_SECRET }}
        run: python scripts/report_outputs.py

bundle:
  name: terramate-api-wrapper
  databricks_cli_version: ">=0.283.0"

# Prerequisite (out-of-band, not managed by this bundle): a secret scope
# holding the GitHub service-account PAT, created once per workspace with
#   databricks secrets create-scope ${var.secret_scope}
#   databricks secrets put-secret ${var.secret_scope} github-pat
# Secret *values* never belong in a bundle — only the app's read access to an
# already-populated scope does (architecture.md §10).

resources:
  database_instances:
    provisioning_db:
      name: "terramate-provisioning-${var.environment}-v1"
      enable_pg_native_login: true
      capacity: "CU_1"
      lifecycle:
        prevent_destroy: true
      permissions:
        # Authoritative ACL — re-grants the deploying user MANAGE, which an
        # unqualified `permissions:` block would otherwise strip on apply.
        - level: CAN_MANAGE
          user_name: "${workspace.current_user.userName}"
        - level: CAN_USE
          service_principal_name: ${resources.apps.terramate-api-wrapper.service_principal_client_id}

  apps:
    terramate-api-wrapper:
      name: ${var.app_name}
      description: "Terramate provisioning abstraction API (${var.environment})"
      source_code_path: "."
      resources:
        # Autoscaling attach (`postgres:`), not the Provisioned `database:`
        # type — every instance created via `database_instances` is now an
        # Autoscaling project, and attaching it as `database:` fails MANAGE
        # validation even with Can Manage on the project.
        - name: postgres
          postgres:
            branch: projects/${resources.database_instances.provisioning_db.name}/branches/production
            database: projects/${resources.database_instances.provisioning_db.name}/branches/production/databases/databricks-postgres
            permission: CAN_CONNECT_AND_CREATE
        - name: github-pat
          secret:
            scope: ${var.secret_scope}
            key: github-pat
            permission: READ
      config:
        command:
          - uvicorn
          - server.main:app
          - --host
          - 0.0.0.0
          - --port
          - "8000"
        env:
          - name: APP_ENVIRONMENT
            value: "${var.environment}"
          - name: LAKEBASE_INSTANCE_NAME
            value: "${resources.database_instances.provisioning_db.name}"
          # When "true", apply `alembic upgrade head` on startup (server/migrate.py),
          # serialized across instances by a pg advisory lock. Default "false":
          # migrations are otherwise a deliberate out-of-band step. Set per target.
          - name: RUN_MIGRATIONS_ON_STARTUP
            value: "${var.run_migrations_on_startup}"
          - name: GITHUB_PAT
            valueFrom: github-pat
          - name: GITHUB_REPO
            value: "${var.github_repo}"
          # How often the in-process reconcile driver (server/scheduler.py, the
          # motor that advances Steps) calls the engine. Optional; the app
          # defaults to 15s if unset.
          - name: RECONCILE_INTERVAL_SECONDS
            value: "15"
          # Root log level for the engine's loggers (server/logging_config.py).
          # Optional; the app defaults to INFO if unset. Set DEBUG to also
          # surface the per-call GitHub transport lines.
          - name: LOG_LEVEL
            value: "INFO"
          # How long (seconds) a Step may sit at `applying` waiting on its
          # Action's output write before the reconcile loop flags it `stuck`
          # and logs a warning. Optional; the app defaults to 3600 (1h).
          - name: STEP_STUCK_THRESHOLD_SECONDS
            value: "3600"
          # Forwarded identities (X-Forwarded-Email / X-Forwarded-User,
          # server/auth.py, #47) allowed to read/flip the intake off-switch.
          # Comma-separated; empty (the default) means nobody is authorized
          # until an operator sets this per target.
          - name: ADMIN_PRINCIPALS
            value: "${var.admin_principals}"

variables:
  app_name:
    description: "Application name"
    default: "terramate-api-wrapper"
  environment:
    description: "Deployment target (dev/stage/prod)"
    default: "dev"
  secret_scope:
    description: "Databricks secret scope holding the GitHub service-account PAT"
    default: "terramate-api-wrapper"
  github_repo:
    description: >-
      "owner/name" of the Terramate repo RealGitHubClient opens PRs against
      (server.github_client, #22). Points at the throwaway fixture repo
      (fixtures/terraform-fixture-repo) until Phase 2's cutover to the real
      Terramate repo (architecture.md §3.1).
    default: "TaylorAHanson/terramate-fixture-repo"
  admin_principals:
    description: >-
      Comma-separated forwarded identities (X-Forwarded-Email /
      X-Forwarded-User) authorized to read/flip the intake off-switch
      (server/auth.py, #47). Empty means nobody is authorized — set per
      target once the operator's identity is known.
    default: ""
  run_migrations_on_startup:
    description: >-
      When "true", the app applies `alembic upgrade head` on startup
      (server/migrate.py), serialized across instances by a Postgres advisory
      lock. Default "false" — migrations are normally a deliberate out-of-band
      step (migrations/env.py). Intended for dev/test targets.
    default: "false"

targets:
  dev:
    mode: development
    default: true
    variables:
      environment: "dev"
      app_name: "terramate-api-wrapper-dev"
      run_migrations_on_startup: "true"
  prod:
    mode: production
    variables:
      environment: "prod"
      app_name: "terramate-api-wrapper"
